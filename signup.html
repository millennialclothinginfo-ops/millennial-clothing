<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Millennial Clothing — Sign Up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=block" rel="stylesheet">
<style>
  :root{
    /* ===== GLOBAL THEME: Light Ash + Dark Black (gradient), shared across every page/CTA ===== */
    --ink:#131316;
    --canvas:#ECECEE;
    --canvas-2:#DEDEE3;
    --dark-1:#3A3A42;
    --dark-2:#000000;
    --amber:#3A3A42;
    --amber-dark:#1B1B1F;
    --thread:#000000;
    --steel:#6C6C74;
    --line:#D2D2D7;
    --white:#FFFFFF;
    --font-body:'Inter', 'Helvetica Neue', Arial, sans-serif;
    --font-display:'Big Shoulders Display', 'Arial Narrow', sans-serif;
    --font-mono:'IBM Plex Mono', 'Courier New', monospace;
    --grad-dark:linear-gradient(135deg, var(--dark-1), var(--dark-2));
  }
  *{box-sizing:border-box; margin:0; padding:0; font-family:inherit;}
  html{-webkit-text-size-adjust:100%; text-size-adjust:100%;}
  body{
    background:#FFFFFF;
    color:var(--ink);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  a{color:inherit; text-decoration:none;}
  img{max-width:100%; display:block;}

  .demo-note{ max-width:1180px; margin:40px auto; padding:0 20px; color:var(--steel); font-size:14px; line-height:1.6; }
  .demo-note code{ font-family:var(--font-mono); background:var(--canvas-2); padding:2px 6px; border-radius:3px; }
  .demo-note a{ color:var(--dark-2); font-weight:600; text-decoration:underline; }

  /* ============================================================
     LOGIN PAGE — dark centered card (Dribbble-referenced layout):
     full dark canvas below the header, one floating card holding
     the logo badge, heading, sign-up line, then the form.
  ============================================================ */
  .auth-section{
    background:#FFFFFF;
    min-height:100vh;
    display:flex; justify-content:center; align-items:flex-start;
    padding:44px 20px 56px;
  }
  .auth-card{
    width:100%; max-width:352px;
    background:rgba(8,8,10,0.80);
    -webkit-backdrop-filter:blur(20px);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,0.07);
    border-radius:18px;
    padding:24px 20px 20px;
    box-shadow:0 20px 44px rgba(0,0,0,0.22), 0 2px 8px rgba(0,0,0,0.18);
  }

  .auth-logo{ display:flex; justify-content:center; margin-bottom:20px; }
  .auth-logo-badge{
    display:flex; align-items:center; justify-content:center;
    width:50px; height:50px; border-radius:14px;
    background:linear-gradient(155deg, rgba(255,255,255,0.14), rgba(255,255,255,0.04) 60%);
    border:1px solid rgba(255,255,255,0.16);
    box-shadow:0 1px 0 rgba(255,255,255,0.12) inset, 0 10px 20px rgba(0,0,0,0.3);
  }
  .auth-logo-badge img{ height:23px; width:auto; filter:brightness(0) invert(1); }

  .auth-heading{
    font-family:var(--font-display); font-weight:800; text-transform:uppercase;
    font-size:22px; letter-spacing:0.01em; color:var(--white); text-align:center;
  }
  .auth-signup{ text-align:center; margin:6px 0 18px; font-size:12.5px; color:rgba(255,255,255,0.5); }
  .auth-signup a{ color:var(--white); font-weight:700; text-decoration:underline; }

  .field-group{ margin-bottom:12px; }
  .field-label{
    display:block; font-family:var(--font-mono); font-size:11px; letter-spacing:0.14em; text-transform:uppercase;
    color:rgba(255,255,255,0.4); margin-bottom:7px;
  }
  .field-shell{
    display:flex; align-items:center; gap:9px;
    background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); border-radius:9px;
    padding:0 12px; height:42px;
  }
  .field-shell:focus-within{ border-color:rgba(255,255,255,0.4); box-shadow:0 0 0 3px rgba(255,255,255,0.06); }
  .field-shell svg{ width:18px; height:18px; color:rgba(255,255,255,0.45); flex-shrink:0; }
  .field-shell input{
    border:none; background:transparent; outline:none; flex:1; min-width:0;
    font-family:var(--font-body); font-size:15px; color:var(--white); height:100%;
  }
  .field-shell input::placeholder{ color:rgba(255,255,255,0.35); }
  .eye-toggle{
    background:none; border:none; padding:4px; cursor:pointer; color:rgba(255,255,255,0.45); display:flex;
  }
  .eye-toggle:hover{ color:var(--white); }

  .field-meta{ display:flex; align-items:center; justify-content:space-between; margin:6px 0 22px; }
  .remember{ display:flex; align-items:center; gap:9px; cursor:pointer; user-select:none; }
  .remember input{ position:absolute; opacity:0; width:0; height:0; }
  .remember-box{
    width:18px; height:18px; border-radius:5px; border:1.5px solid rgba(255,255,255,0.25);
    background:transparent; display:flex; align-items:center; justify-content:center; flex-shrink:0;
    transition:background 0.15s ease, border-color 0.15s ease;
  }
  .remember-box svg{ width:12px; height:12px; opacity:0; transform:scale(0.6); transition:opacity 0.15s ease, transform 0.15s ease; color:var(--ink); }
  .remember input:checked + .remember-box{ background:var(--white); border-color:var(--white); }
  .remember input:checked + .remember-box svg{ opacity:1; transform:scale(1); }
  .remember span{ font-size:13.5px; color:rgba(255,255,255,0.55); }
  .forgot-link{ font-size:13px; font-family:var(--font-mono); color:rgba(255,255,255,0.55); letter-spacing:0.02em; }
  .forgot-link:hover{ color:var(--white); text-decoration:underline; }

  .login-btn{
    width:100%; height:44px; border:none; border-radius:9px; cursor:pointer;
    background:var(--white); color:var(--ink);
    font-family:var(--font-mono); font-size:12.5px; letter-spacing:0.12em; text-transform:uppercase;
    transition:transform 0.15s ease, box-shadow 0.15s ease;
    box-shadow:0 10px 20px rgba(0,0,0,0.3);
  }
  .login-btn:hover{ transform:translateY(-1px); box-shadow:0 14px 26px rgba(0,0,0,0.35); }
  .login-btn:active{ transform:translateY(0); }

  .divider{ display:flex; align-items:center; gap:10px; margin:18px 0 14px; }
  .divider::before, .divider::after{ content:''; flex:1; height:1px; background:rgba(255,255,255,0.12); }
  .divider span{ font-family:var(--font-mono); font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:rgba(255,255,255,0.4); white-space:nowrap; }

  .social-row{ display:flex; gap:12px; }
  .social-btn{
    flex:1; height:40px; border-radius:9px; border:1px solid rgba(255,255,255,0.1); background:rgba(255,255,255,0.05);
    display:flex; align-items:center; justify-content:center; gap:7px; cursor:pointer;
    font-family:var(--font-body); font-size:12px; font-weight:600; color:var(--white);
    transition:border-color 0.15s ease, background 0.15s ease, transform 0.15s ease;
  }
  .social-btn:hover{ border-color:rgba(255,255,255,0.3); background:rgba(255,255,255,0.09); transform:translateY(-1px); }
  .social-btn svg{ width:18px; height:18px; flex-shrink:0; }

  .name-row{ display:flex; gap:12px; }
  .name-row .field-group{ flex:1; min-width:0; }

  .check-group{ display:flex; flex-direction:column; gap:12px; margin:6px 0 22px; }
  .check-row{ display:flex; align-items:flex-start; gap:9px; cursor:pointer; user-select:none; }
  .check-row input{ position:absolute; opacity:0; width:0; height:0; }
  .check-box{
    width:18px; height:18px; border-radius:5px; border:1.5px solid rgba(255,255,255,0.25);
    background:transparent; display:flex; align-items:center; justify-content:center; flex-shrink:0;
    margin-top:1px;
    transition:background 0.15s ease, border-color 0.15s ease;
  }
  .check-box svg{ width:12px; height:12px; opacity:0; transform:scale(0.6); transition:opacity 0.15s ease, transform 0.15s ease; color:var(--ink); }
  .check-row input:checked + .check-box{ background:var(--white); border-color:var(--white); }
  .check-row input:checked + .check-box svg{ opacity:1; transform:scale(1); }
  .check-row span{ font-size:13.5px; color:rgba(255,255,255,0.55); line-height:1.5; }
  .check-row a{ color:var(--white); font-weight:700; text-decoration:underline; }
  .check-row.field-error .check-box{ border-color:#E5766B; }

  .field-shell.field-error{ border-color:#E5766B; box-shadow:0 0 0 3px rgba(229,118,107,0.12); }
  .form-error{ display:none; font-size:12px; color:#E5766B; margin:-8px 0 14px; line-height:1.5; }
  .form-error.show{ display:block; }

  @media (max-width:400px){
    .auth-heading{ font-size:26px; }
    .social-btn span{ display:none; }
    .name-row{ flex-direction:column; gap:0; }
  }

</style>
<script src="assets/js/site-nav.js"></script>
</head>

    <h1 class="auth-heading">Create Account</h1>
    <p class="auth-signup">Already have an account? <a href="login.html">Log In</a></p>

    <form id="signupForm" novalidate>
      <div class="name-row">
        <div class="field-group">
          <label class="field-label" for="firstName">First Name</label>
          <div class="field-shell">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <input id="firstName" name="firstName" type="text" placeholder="First Name" autocomplete="given-name" required>
          </div>
        </div>
        <div class="field-group">
          <label class="field-label" for="lastName">Last Name</label>
          <div class="field-shell">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <input id="lastName" name="lastName" type="text" placeholder="Last Name" autocomplete="family-name" required>
          </div>
        </div>
      </div>

      <div class="field-group">
        <label class="field-label" for="email">Email</label>
        <div class="field-shell">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 6l9 7 9-7"/></svg>
          <input id="email" name="email" type="email" placeholder="Type Your Email" autocomplete="email" required>
        </div>
      </div>

      <div class="field-group">
        <label class="field-label" for="contactNo">Contact No</label>
        <div class="field-shell">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3.1-8.7A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 3a2 2 0 0 1-.5 2.1L8 10.1a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c1 .3 2 .6 3 .7a2 2 0 0 1 1.7 2z"/></svg>
          <input id="contactNo" name="contactNo" type="tel" inputmode="tel" placeholder="Type Your Contact No" autocomplete="tel" required>
        </div>
      </div>

      <div class="field-group">
        <label class="field-label" for="password">Password</label>
        <div class="field-shell">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
          <input id="password" name="password" type="password" placeholder="Enter Password" autocomplete="new-password" required>
          <button type="button" class="eye-toggle" data-target="password" aria-label="Show password" aria-pressed="false">
            <svg class="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="field-group">
        <label class="field-label" for="confirmPassword">Confirm Password</label>
        <div class="field-shell">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
          <input id="confirmPassword" name="confirmPassword" type="password" placeholder="Confirm Password" autocomplete="new-password" required>
          <button type="button" class="eye-toggle" data-target="confirmPassword" aria-label="Show password" aria-pressed="false">
            <svg class="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="check-group">
        <label class="check-row" id="humanCheckRow">
          <input type="checkbox" id="humanCheck">
          <span class="check-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          </span>
          <span>I confirm that I am human</span>
        </label>
        <label class="check-row" id="privacyCheckRow">
          <input type="checkbox" id="privacyCheck">
          <span class="check-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          </span>
          <span>I agree to the <a href="#">Privacy Policy</a> and <a href="#">Terms of Service</a></span>
        </label>
      </div>

      <p class="form-error" id="formError"></p>

      <button type="submit" class="login-btn">Sign Up</button>

      <div class="divider"><span>Or Continue With</span></div>

      <div class="social-row">
        <button type="button" class="social-btn" aria-label="Continue with Google" onclick="location.href='social-redirect.html?provider=google'">
          <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l5.7-5.7C34.6 6.1 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.8 1.1 8 3l5.7-5.7C34.6 6.1 29.6 4 24 4c-7.5 0-14 4.2-17.7 10.7z"/><path fill="#4CAF50" d="M24 44c5.5 0 10.4-2.1 14.1-5.6l-6.5-5.5C29.6 34.6 27 35.5 24 35.5c-5.3 0-9.7-3.3-11.3-8l-6.6 5.1C9.9 39.7 16.4 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.2 5.9l6.5 5.5C40 36.9 44 31 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>
          <span>Google</span>
        </button>
        <button type="button" class="social-btn" aria-label="Continue with Facebook" onclick="location.href='social-redirect.html?provider=facebook'">
          <svg viewBox="0 0 24 24" fill="#1877F2"><path d="M22 12a10 10 0 1 0-11.6 9.9v-7H7.9V12h2.5V9.8c0-2.5 1.5-3.9 3.8-3.9 1.1 0 2.2.2 2.2.2v2.5h-1.3c-1.2 0-1.6.8-1.6 1.6V12h2.8l-.4 2.9h-2.4v7A10 10 0 0 0 22 12z"/></svg>
          <span>Facebook</span>
        </button>
        <button type="button" class="social-btn" aria-label="Continue with Phone Number" onclick="location.href='login-phone.html'">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3.1-8.7A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 3a2 2 0 0 1-.5 2.1L8 10.1a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c1 .3 2 .6 3 .7a2 2 0 0 1 1.7 2z"/></svg>
          <span>Phone No.</span>
        </button>
      </div>
    </form>
  </div>
</section>

<script>
  (function(){
    var toggles = document.querySelectorAll('.eye-toggle');
    toggles.forEach(function(toggle){
      var pass = document.getElementById(toggle.getAttribute('data-target'));
      var icon = toggle.querySelector('.eyeIcon');
      if(!pass || !icon) return;
      toggle.addEventListener('click', function(){
        var showing = pass.type === 'text';
        pass.type = showing ? 'password' : 'text';
        toggle.setAttribute('aria-pressed', String(!showing));
        toggle.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
        icon.innerHTML = showing
          ? '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>'
          : '<path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a19.9 19.9 0 0 1 5.06-5.94M9.9 4.24A10.6 10.6 0 0 1 12 4c7 0 11 8 11 8a19.9 19.9 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
      });
    });
  })();

  document.getElementById('signupForm').addEventListener('submit', function(e){
    e.preventDefault();

    var errorEl = document.getElementById('formError');
    var errors = [];

    var firstName = document.getElementById('firstName');
    var lastName = document.getElementById('lastName');
    var email = document.getElementById('email');
    var contactNo = document.getElementById('contactNo');
    var password = document.getElementById('password');
    var confirmPassword = document.getElementById('confirmPassword');
    var humanCheck = document.getElementById('humanCheck');
    var privacyCheck = document.getElementById('privacyCheck');
    var humanRow = document.getElementById('humanCheckRow');
    var privacyRow = document.getElementById('privacyCheckRow');

    // Reset error states
    [firstName, lastName, email, contactNo, password, confirmPassword].forEach(function(input){
      input.closest('.field-shell').classList.remove('field-error');
    });
    humanRow.classList.remove('field-error');
    privacyRow.classList.remove('field-error');

    if(!firstName.value.trim()){ errors.push('First name is required.'); firstName.closest('.field-shell').classList.add('field-error'); }
    if(!lastName.value.trim()){ errors.push('Last name is required.'); lastName.closest('.field-shell').classList.add('field-error'); }
    if(!email.value.trim()){ errors.push('Email is required.'); email.closest('.field-shell').classList.add('field-error'); }
    if(!contactNo.value.trim()){ errors.push('Contact number is required.'); contactNo.closest('.field-shell').classList.add('field-error'); }
    if(!password.value){ errors.push('Password is required.'); password.closest('.field-shell').classList.add('field-error'); }
    if(password.value && password.value.length < 6){ errors.push('Password must be at least 6 characters.'); password.closest('.field-shell').classList.add('field-error'); }
    if(confirmPassword.value !== password.value || !confirmPassword.value){ errors.push('Passwords do not match.'); confirmPassword.closest('.field-shell').classList.add('field-error'); }
    if(!humanCheck.checked){ errors.push('Please confirm you are human.'); humanRow.classList.add('field-error'); }
    if(!privacyCheck.checked){ errors.push('Please agree to the Privacy Policy and Terms of Service.'); privacyRow.classList.add('field-error'); }

    if(errors.length){
      errorEl.textContent = errors[0];
      errorEl.classList.add('show');
      return;
    }

    errorEl.classList.remove('show');

    // Demo: send the new user to email OTP verification, then back to Log In.
    var url = 'otp-verification.html?next=login.html';
    if(email.value){ url += '&to=' + encodeURIComponent(email.value); }
    window.location.href = url;
  });
</script>

</body>
</html>
